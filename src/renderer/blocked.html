<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>Focus</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="blocked">
      <div class="moon">🌙</div>
      <section class="hidden" id="offer">
        <h1><span class="name"></span> is blocked</h1>
        <p class="muted" id="offer-text"></p>
        <p class="stats hidden"></p>
        <div class="actions">
          <button type="button" id="not-now">Not now</button>
          <button type="button" class="primary" id="start" autofocus></button>
        </div>
      </section>
      <section class="hidden" id="notice">
        <h1 id="notice-title"></h1>
        <p class="muted" id="notice-text"></p>
        <p class="stats hidden"></p>
        <button type="button" class="primary close">OK</button>
      </section>
      <section class="hidden" id="used">
        <h1><span class="name"></span> is blocked</h1>
        <p class="muted">Kid mode was already used today. It's available again tomorrow.</p>
        <button type="button" class="primary close">OK</button>
      </section>
    </main>
    <script src="escape.js"></script>
    <script src="blocked.js"></script>
  </body>
</html>
